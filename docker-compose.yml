services:
  app:
    build: .
    image: logisuite-tms:latest
    container_name: logisuite-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Bogota}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      # Persistencia de SQLite: la base vive en el host, fuera del contenedor.
      - ./data:/app/data
