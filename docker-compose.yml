# Westvane TMS multimodal: API FastAPI (8000) + frontend Next.js (3000).
#   docker compose up -d --build
services:
  backend:
    build: ./backend
    image: westvane-api:latest
    container_name: westvane-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Bogota}
      WESTVANE_DB_PATH: /data/logistics.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Persistencia de SQLite en el host
      - ./backend/data:/data
    # Registros de Docker con tope (10 MB x 3 por contenedor): sin esto crecen hasta llenar el disco
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-}
        ALLOW_INDEXING: ${ALLOW_INDEXING:-}
    image: westvane-web:latest
    container_name: westvane-web
    restart: unless-stopped
    environment:
      # El proxy /api/* del frontend llega a la API por la red interna
      API_INTERNAL_URL: http://backend:8000
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${WEB_PORT:-3000}:3000"
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
