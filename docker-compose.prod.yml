# Producción en una VM: se usa junto con el compose base.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Añade Caddy (HTTPS automático) como única puerta de entrada pública. La API
# y el frontend dejan de publicar puertos al host.
services:
  backend:
    ports: !reset []
    environment:
      # Sin documentación interactiva de la API (/docs) en producción
      WESTVANE_ENV: production
    # Un contenedor desbocado no puede llevarse la memoria de toda la máquina
    mem_limit: 1g

  frontend:
    ports: !reset []
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    container_name: logisuite-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env (ej. logisuite.midominio.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
