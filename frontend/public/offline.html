<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión · Westvane</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --muted: #515154; --accent: #0064c8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #409cff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: .65rem 1.4rem; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #000; } }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>No se pudo llegar al servidor de Westvane. Revisa tu internet; en cuanto vuelva puedes seguir donde estabas. Lo que no alcanzaste a guardar no se envió.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
